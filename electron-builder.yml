appId: top.stifa.slate
productName: Slate
directories:
  buildResources: build
  output: dist
electronLanguages:
  - en-US
files:
  - out/**
  - package.json
afterSign: scripts/sign-mac.cjs
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: true
  artifactName: Slate-Setup-${version}.${ext}
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.png
  category: public.app-category.developer-tools
  # Ad-hoc signature: enough for Apple Silicon to launch a local build. In CI, scripts/sign-mac.cjs
  # then re-signs with a self-signed certificate so the signature, and with it keychain access,
  # stays the same across updates. Avoiding the "unidentified developer" prompt would need a
  # Developer ID and notarization.
  identity: '-'
  hardenedRuntime: false
dmg:
  artifactName: Slate-${version}-${arch}.${ext}
linux:
  target: AppImage
  icon: build/icon.png
  category: Development
