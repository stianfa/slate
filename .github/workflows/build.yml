# Builds Slate for Windows and macOS on every push, so a Mac build doesn't need a Mac.
# Download the installers from the run's artifacts.
name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit and database tests
        shell: bash
        run: |
          npm run db &
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/55432) 2>/dev/null && break; sleep 1; done
          npm test
      # The same self-signed certificate on every build keeps the signature stable, so macOS lets
      # new versions read the passwords and API key that earlier ones saved in the keychain.
      - name: Import the Mac signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then
            echo "::warning::MAC_CERT_P12 is not set, so this build is ad-hoc signed and loses keychain access after an update."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/slate-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/slate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/slate.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/slate.p12"
          echo "SLATE_SIGN_IDENTITY=Slate Self-Signed" >> "$GITHUB_ENV"
          echo "SLATE_SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then npm run dist:mac; else npm run dist; fi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: slate-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
