# Builds Slate for Windows and macOS on every push, so a Mac build doesn't need a Mac.
# Download the installers from the run's artifacts.
name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit and database tests
        shell: bash
        run: |
          npm run db &
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/55432) 2>/dev/null && break; sleep 1; done
          npm test
      - name: Package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then npm run dist:mac; else npm run dist; fi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: slate-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
